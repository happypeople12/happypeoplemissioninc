<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#090909" />
  <meta name="description" content="Happy People Mission — Every Person Has a Mission." />
  <title>Happy People Mission</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#home" aria-label="Happy People Mission home">
      <img src="assets/logo.jpg" alt="Happy People Mission" />
    </a>
    <div class="lang-switch" aria-label="Language">
      <button class="lang active" data-lang="en">EN</button>
      <button class="lang" data-lang="ua">UA</button>
      <button class="lang" data-lang="ru">RU</button>
    </div>
    <button class="menu-btn" id="menuBtn" aria-label="Open menu">☰</button>
  </header>

  <nav class="mobile-menu" id="mobileMenu">
    <a href="#about" data-i18n="nav_about"></a>
    <a href="#foundation" data-i18n="nav_foundation"></a>
    <a href="#work" data-i18n="nav_work"></a>
    <a href="#support" data-i18n="nav_support"></a>
    <a href="#goal" data-i18n="nav_goal"></a>
  </nav>

  <main id="home">
    <section class="hero">
      <div class="hero-copy">
        <div class="eyebrow">HELP ONE MORE</div>
        <h1>
          <span data-i18n="hero_1"></span><br>
          <span data-i18n="hero_2"></span>
          <span class="gold" data-i18n="hero_3"></span>
        </h1>
        <p data-i18n="hero_text"></p>
        <div class="hero-actions">
          <a href="#support" class="btn btn-gold" data-i18n="support_btn"></a>
          <a href="#foundation" class="btn btn-outline" data-i18n="learn_more"></a>
        </div>
      </div>
      <div class="hero-photo">
        <img src="assets/hero.jpg" alt="Person standing on a mountain at sunrise" />
      </div>
    </section>

    <section class="pillars" aria-label="Mission pillars">
      <article>
        <div class="icon">♡</div>
        <h3 data-i18n="pillar_1_title"></h3>
        <p data-i18n="pillar_1_text"></p>
      </article>
      <article>
        <div class="icon">♧</div>
        <h3 data-i18n="pillar_2_title"></h3>
        <p data-i18n="pillar_2_text"></p>
      </article>
      <article>
        <div class="icon">🤝</div>
        <h3 data-i18n="pillar_3_title"></h3>
        <p data-i18n="pillar_3_text"></p>
      </article>
      <article>
        <div class="icon">◎</div>
        <h3 data-i18n="pillar_4_title"></h3>
        <p data-i18n="pillar_4_text"></p>
      </article>
    </section>

    <section class="content-grid" id="about">
      <article class="card paper" id="foundation">
        <div class="card-label">FOUNDATION</div>
        <h2 data-i18n="foundation_title"></h2>
        <blockquote data-i18n="foundation_quote"></blockquote>
        <div class="scripture" data-i18n="foundation_ref"></div>
        <p data-i18n="foundation_text"></p>
      </article>

      <article class="card paper" id="work">
        <div class="card-label">ACTION</div>
        <h2 data-i18n="work_title"></h2>
        <p data-i18n="work_intro"></p>
        <ul id="workList"></ul>
      </article>
    </section>

    <section class="support-card" id="support">
      <div class="support-header">
        <span class="mini-label">HELP ONE MORE</span>
        <h2 data-i18n="support_title"></h2>
        <p data-i18n="support_text"></p>
      </div>

      <a class="payment paypal" href="https://www.paypal.com/ncp/payment/MW7SZHHZNCH62" target="_blank" rel="noopener noreferrer">
        <div>
          <strong data-i18n="paypal_title"></strong>
          <span>PayPal</span>
        </div>
        <b>→</b>
      </a>

      <a class="payment bluevine" href="https://pay.bluevine.com/p/71c521d8cd7b452f9d86d6f129be7eaa" target="_blank" rel="noopener noreferrer">
        <div>
          <strong data-i18n="bluevine_title"></strong>
          <span>Bluevine</span>
        </div>
        <b>→</b>
      </a>

      <div class="secure" data-i18n="secure"></div>
    </section>

    <section class="goal-grid" id="goal">
      <article class="card paper">
        <div class="card-label">MISSION</div>
        <h2 data-i18n="goal_title"></h2>
        <ul id="goalList"></ul>
      </article>

      <article class="card quote-card">
        <div class="quote-mark">“</div>
        <h2 data-i18n="not_alone"></h2>
        <p data-i18n="purpose"></p>
        <strong>HAPPYPEOPLE MISSION</strong>
      </article>
    </section>
  </main>

  <footer>
    <div>HELP ONE MORE</div>
    <div data-i18n="footer"></div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
