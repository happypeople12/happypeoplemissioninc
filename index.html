<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy People Mission</title>
<meta name="description" content="Happy People Mission — Every Person Has a Mission.">
<style>
:root {
  --gold:#c79a2b;
  --gold-2:#e4b747;
  --black:#0b0b0c;
  --ink:#141414;
  --paper:#f7f5f0;
  --white:#fff;
  --muted:#6f6f73;
  --line:rgba(15,15,16,.12);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);
  background:
    radial-gradient(circle at 10% 10%, rgba(199,154,43,.08), transparent 24%),
    linear-gradient(#fbfaf7,#f5f2ec);
}
a{color:inherit;text-decoration:none}
.container{width:min(1160px,calc(100% - 32px));margin:auto}
.header{
  position:sticky;top:0;z-index:30;backdrop-filter:blur(16px);
  background:rgba(247,245,240,.88);border-bottom:1px solid var(--line)
}
.header-inner{height:74px;display:flex;align-items:center;gap:20px}
.logo{width:178px;max-height:54px;object-fit:contain;object-position:left center}
.nav{display:flex;gap:22px;margin-left:auto;font-size:14px;font-weight:700}
.lang{display:flex;gap:6px;margin-left:14px}
.lang button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 11px;font-weight:800;cursor:pointer}
.lang button.active{background:var(--black);color:#fff;border-color:var(--black)}
.hero{padding:70px 0 48px}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:42px;align-items:stretch}
.hero-card{position:relative;overflow:hidden;border-radius:30px;background:var(--black);min-height:560px;box-shadow:0 20px 50px rgba(0,0,0,.12)}
.hero-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.8) contrast(1.08);opacity:.74}
.hero-card:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.92),rgba(0,0,0,.3) 65%,rgba(0,0,0,.08))}
.hero-content{position:relative;z-index:2;padding:56px;color:#fff;max-width:690px}
.kicker{letter-spacing:.28em;text-transform:uppercase;font-size:12px;font-weight:800;color:var(--gold-2)}
h1{font-size:clamp(52px,7vw,92px);line-height:.93;margin:22px 0 24px;letter-spacing:-.055em}
h1 .gold{color:var(--gold-2)}
.lead{font-size:20px;line-height:1.55;max-width:720px;color:#eee}
.cta-row{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 18px;border-radius:12px;font-weight:800;border:1px solid transparent}
.btn-primary{background:var(--gold-2);color:#111}
.btn-ghost{border-color:rgba(255,255,255,.28);color:white;background:rgba(255,255,255,.05)}
.side-intro{display:grid;gap:20px}
.quote-card,.info-card{border:1px solid var(--line);border-radius:24px;padding:30px;background:rgba(255,255,255,.74);box-shadow:0 14px 35px rgba(0,0,0,.05)}
.quote-card{background:#111;color:#fff}
.quote-mark{font-size:68px;line-height:.7;color:var(--gold-2)}
.quote-text{font-size:25px;line-height:1.35;margin:18px 0}
.ref{color:var(--gold-2);font-weight:800}
.section{padding:38px 0}
.section-title{font-size:clamp(34px,5vw,58px);letter-spacing:-.04em;margin:0 0 18px}
.section-sub{color:var(--muted);font-size:18px;line-height:1.6}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.card{border:1px solid var(--line);border-radius:24px;padding:28px;background:#fff;box-shadow:0 14px 35px rgba(0,0,0,.04)}
.card.dark{background:#101012;color:#fff}
.card h3{font-size:26px;margin:0 0 12px}
.stats{display:grid;gap:12px;margin-top:20px}
.stat{padding:14px 16px;border-radius:14px;background:rgba(199,154,43,.09);border:1px solid rgba(199,154,43,.22)}
.dark .stat{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.1)}
.list{display:grid;gap:13px;margin:18px 0 0;padding:0;list-style:none}
.list li{display:flex;gap:12px;line-height:1.45}
.dot{width:21px;height:21px;border-radius:50%;background:var(--gold-2);color:#111;display:grid;place-items:center;font-size:12px;font-weight:900;flex:0 0 auto}
.highlight{padding:20px;border-left:4px solid var(--gold-2);background:rgba(199,154,43,.08);border-radius:0 16px 16px 0;margin-top:22px}
.support{background:#111;color:#fff;border-radius:32px;padding:42px;position:relative;overflow:hidden}
.support:before{content:"";position:absolute;width:260px;height:260px;border:1px solid rgba(228,183,71,.26);border-radius:50%;right:-70px;top:-70px}
.support h2{font-size:clamp(38px,5vw,64px);margin:0 0 14px}
.support p{font-size:19px;line-height:1.6;max-width:760px;color:#ddd}
.footer{margin-top:54px;background:#090909;color:#fff;padding:34px 0}
.footer-inner{display:flex;align-items:center;gap:22px;justify-content:space-between}
.footer-logo{width:150px;filter:none}
.footer-tag{letter-spacing:.24em;font-size:12px;color:#ddd;text-align:right}
.gold-line{height:2px;background:linear-gradient(90deg,var(--gold),transparent);margin:22px 0}
@media (max-width:900px){
  .nav{display:none}
  .header-inner{height:68px}
  .logo{width:150px}
  .hero{padding-top:26px}
  .hero-grid,.grid-2{grid-template-columns:1fr}
  .hero-card{min-height:520px}
  .hero-content{padding:34px 26px}
  .footer-inner{align-items:flex-start;flex-direction:column}
  .footer-tag{text-align:left}
}
@media (max-width:560px){
  .container{width:min(100% - 20px,1160px)}
  .lang{margin-left:auto}
  .lang button{padding:8px 9px}
  .hero-content{padding:28px 22px}
  h1{font-size:51px}
  .lead{font-size:17px}
  .quote-text{font-size:21px}
  .card,.quote-card,.info-card{padding:22px}
  .support{padding:28px 22px}
}
</style>
</head>
