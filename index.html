<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0b0b" />
  <title>HAPPYPEOPLE MISSION</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo-text">happy<br>people</div>
      <div class="mission-word">MISSION</div>
    </div>
    <div class="lang-switch">
      <button class="lang active" data-lang="en">EN</button>
      <button class="lang" data-lang="ua">UA</button>
      <button class="lang" data-lang="ru">RU</button>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-copy">
        <div class="eyebrow">HELP ONE MORE</div>
        <h1 data-i18n="headline"></h1>
        <p data-i18n="intro"></p>
      </div>
      <div class="hero-visual">
        <img src="assets/reference.png" alt="Happy People Mission visual" />
      </div>
    </section>

    <section class="two-col">
      <article class="paper-card">
        <div class="icon-box">♛</div>
        <h2 data-i18n="foundation_title"></h2>
        <blockquote data-i18n="foundation_quote"></blockquote>
        <div class="verse">Ephesians 2:10</div>
        <p data-i18n="foundation_text"></p>
      </article>

      <article class="paper-card">
        <div class="icon-box">⚡</div>
        <h2 data-i18n="doing_title"></h2>
        <p data-i18n="doing_intro"></p>
        <ul id="doingList"></ul>
      </article>
    </section>

    <section class="two-col">
      <article class="dark-card">
        <div class="icon-box">◎</div>
        <h2 data-i18n="about_title"></h2>
        <p data-i18n="about_text"></p>
        <div class="details">
          <div><strong>EIN:</strong> 33-4843029</div>
          <div><strong data-i18n="assigned_label"></strong> April 29, 2025</div>
          <div data-i18n="irs_line"></div>
        </div>
        <p data-i18n="public_records"></p>
      </article>

      <article class="paper-card help-card">
        <div class="icon-box">♡</div>
        <h2 data-i18n="help_title"></h2>
        <p data-i18n="help_intro"></p>
        <ul id="helpList"></ul>
        <div class="quote-block">
          <strong data-i18n="not_alone"></strong>
          <span data-i18n="purpose"></span>
        </div>
      </article>
    </section>

    <section class="goal-support">
      <article class="paper-card">
        <div class="icon-box">🎯</div>
        <h2 data-i18n="goal_title"></h2>
        <ul id="goalList"></ul>
        <div class="goal-highlight">
          <strong data-i18n="goal_simple"></strong>
          <span data-i18n="goal_main"></span>
        </div>
      </article>

      <article class="support-card">
        <div class="support-header">
          <h2 data-i18n="support_title"></h2>
          <p data-i18n="support_text"></p>
        </div>

        <a class="donate paypal" href="https://www.paypal.com/ncp/payment/MW7SZHHZNCH62" target="_blank" rel="noopener noreferrer">
          <div>
            <strong data-i18n="paypal"></strong>
            <small>PayPal</small>
          </div>
          <span>→</span>
        </a>

        <a class="donate bank" href="https://pay.bluevine.com/p/71c521d8cd7b452f9d86d6f129be7eaa" target="_blank" rel="noopener noreferrer">
          <div>
            <strong data-i18n="bluevine"></strong>
            <small>Bluevine</small>
          </div>
          <span>→</span>
        </a>

        <div class="secure" data-i18n="secure"></div>
      </article>
    </section>
  </main>

  <footer>
    <span>HELP ONE MORE</span>
    <span data-i18n="footer"></span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
