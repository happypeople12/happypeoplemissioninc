<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="description" content="Happy People Mission">
  <title>Happy People Mission</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header">
  <a class="brand" href="#top">
    <img src="assets/happy-people-logo.jpg" alt="Happy People">
    <span>MISSION</span>
  </a>
  <nav class="desktop-nav">
    <a href="#foundation" data-i18n="nav_story"></a>
    <a href="#about" data-i18n="nav_about"></a>
    <a href="#work" data-i18n="nav_work"></a>
    <a href="#support" data-i18n="nav_support"></a>
  </nav>
  <div class="lang-switch">
    <button class="lang active" data-lang="en">EN</button>
    <button class="lang" data-lang="ua">UA</button>
    <button class="lang" data-lang="ru">RU</button>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="hero-bg"></div>
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <span class="eyebrow" data-i18n="kicker"></span>
      <h1 data-i18n="hero_title"></h1>
      <p data-i18n="hero_text"></p>
      <div class="hero-actions">
        <a class="btn primary" href="#support" data-i18n="cta_support"></a>
        <a class="btn secondary" href="#foundation" data-i18n="cta_discover"></a>
      </div>
    </div>
    <div class="hero-tag">YOUR LIFE<br>YOUR MISSION</div>
  </section>

  <section class="quick-strip">
    <div><span>01</span><strong>HOPE</strong></div>
    <div><span>02</span><strong>LOVE</strong></div>
    <div><span>03</span><strong>SERVE</strong></div>
    <div><span>04</span><strong>MISSION</strong></div>
  </section>

  <section class="cards-grid" id="foundation">
    <article class="card card-light feature-card">
      <div class="card-number">01</div>
      <div class="icon-badge">♛</div>
      <h2 data-i18n="foundation_title"></h2>
      <blockquote data-i18n="foundation_quote"></blockquote>
      <div class="verse" data-i18n="foundation_ref"></div>
      <p data-i18n="foundation_text"></p>
    </article>

    <article class="card card-dark" id="about">
      <div class="card-number">02</div>
      <div class="icon-badge gold">◎</div>
      <h2 data-i18n="about_title"></h2>
      <p data-i18n="about_text"></p>
      <div class="identity-box">
        <div><span>EIN</span><strong>33-4843029</strong></div>
        <div><span data-i18n="assigned"></span><strong>April 29, 2025</strong></div>
      </div>
      <p class="muted" data-i18n="verified"></p>
      <p class="muted" data-i18n="records"></p>
    </article>
  </section>

  <section class="impact-section" id="work">
    <div class="section-heading">
      <span class="eyebrow">LIVE MISSION</span>
      <h2 data-i18n="work_title"></h2>
      <p data-i18n="work_intro"></p>
    </div>
    <div class="impact-grid" id="workList"></div>
  </section>

  <section class="split-section">
    <article class="card card-light">
      <div class="card-number">03</div>
      <div class="icon-badge">♡</div>
      <h2 data-i18n="help_title"></h2>
      <p data-i18n="help_intro"></p>
      <ul id="helpList"></ul>
      <div class="statement" data-i18n="quote"></div>
    </article>

    <article class="card goal-card">
      <div class="card-number">04</div>
      <div class="icon-badge gold">◎</div>
      <h2 data-i18n="goal_title"></h2>
      <ul id="goalList"></ul>
      <div class="goal-highlight" data-i18n="goal_main"></div>
    </article>
  </section>

  <section class="support-section" id="support">
    <div class="support-copy">
      <span class="eyebrow">HELP ONE MORE</span>
      <h2 data-i18n="support_title"></h2>
      <p data-i18n="support_text"></p>
      <div class="secure" data-i18n="secure"></div>
    </div>
    <div class="payment-stack">
      <a class="pay-card paypal" href="https://www.paypal.com/ncp/payment/MW7SZHHZNCH62" target="_blank" rel="noopener">
        <div class="pay-brand">P</div>
        <div><strong data-i18n="paypal"></strong><span>PayPal</span></div>
        <b>↗</b>
      </a>
      <a class="pay-card bank" href="https://pay.bluevine.com/p/71c521d8cd7b452f9d86d6f129be7eaa" target="_blank" rel="noopener">
        <div class="pay-brand leaf">◒</div>
        <div><strong data-i18n="bluevine"></strong><span>Bluevine</span></div>
        <b>↗</b>
      </a>
    </div>
  </section>
</main>

<footer>
  <img src="assets/happy-people-logo.jpg" alt="">
  <span>HELP ONE MORE</span>
  <span data-i18n="footer"></span>
</footer>

<script src="app.js"></script>
</body>
</html>
